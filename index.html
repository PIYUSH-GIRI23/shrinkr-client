<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Security & CSP -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https: http:; object-src 'none'; base-uri 'self'; form-action 'self';" />
    <meta http-equiv="Cross-Origin-Resource-Policy" content="same-origin" />

    <!-- SEO Meta Tags -->
    <title>Shrinkr — Smart, Secure & Shareable URL Shortener</title>
    <meta name="description" content="Shrinkr is a modern, ultra-fast, and secure URL shortener service with QR code generation, click analytics, and custom link management." />
    <meta name="keywords" content="URL shortener, short link, link manager, QR code generator, link analytics, secure URL, shrinkr, x.piyx.me" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="author" content="Shrinkr" />
    <link rel="canonical" href="https://x.piyx.me/" />

    <!-- Favicon & Icons -->
    <link rel="shortcut icon" href="/favicon.png" type="image/png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="theme-color" content="#071129" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://x.piyx.me/" />
    <meta property="og:title" content="Shrinkr — Smart, Secure & Shareable URL Shortener" />
    <meta property="og:description" content="Shorten URLs, generate instant QR codes, and track detailed click analytics effortlessly with Shrinkr." />
    <meta property="og:image" content="https://x.piyx.me/logo.png" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://x.piyx.me/" />
    <meta name="twitter:title" content="Shrinkr — Smart, Secure & Shareable URL Shortener" />
    <meta name="twitter:description" content="Shorten URLs, generate instant QR codes, and track detailed click analytics effortlessly with Shrinkr." />
    <meta name="twitter:image" content="https://x.piyx.me/logo.png" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
